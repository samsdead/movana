name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests and verified build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        shell: bash
        run: |
          scan_dir="$(mktemp -d)"
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$scan_dir/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/$archive" | sha256sum --check --strict
          tar -xzf "$scan_dir/$archive" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git --redact=100 --log-opts=--all --max-archive-depth=1 --max-decode-depth=2 .
